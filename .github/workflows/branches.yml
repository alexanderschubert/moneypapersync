# =============================================================
# MoneyPaperSync - Aufraeumen
# =============================================================
# Loescht den Branch eines gemergten Pull Requests. Ausgenommen sind
# main und dev (die dauerhaften Branches) und Branches aus Forks.
# Ersetzt die GitHub-Einstellung "Automatically delete head branches",
# die beim Merge von dev nach main auch dev loeschen wuerde.
# =============================================================
name: Branches aufraeumen

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  loeschen:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Branch loeschen
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
            && echo "Branch ${BRANCH} geloescht." \
            || echo "Branch ${BRANCH} war schon weg."
